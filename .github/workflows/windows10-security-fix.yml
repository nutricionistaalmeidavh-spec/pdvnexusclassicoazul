name: Windows 10 Security Fix

on:
  push:
    branches:
      - security/windows10-high-vulns
    paths:
      - .github/workflows/windows10-security-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/windows10-high-vulns
          fetch-depth: 0
          persist-credentials: true

      - name: Capture legacy tree
        id: legacy
        shell: pwsh
        run: |
          $tree = git rev-parse HEAD:windows-7
          "tree=$tree" >> $env:GITHUB_OUTPUT
          Write-Host "Legacy tree: $tree"

      - name: Update Windows 10 dependencies only
        working-directory: windows-10
        shell: pwsh
        run: |
          npm install --save-dev electron@40.10.3
          npm audit fix

      - name: Verify no high vulnerabilities remain
        working-directory: windows-10
        run: npm audit --audit-level=high

      - name: Typecheck
        working-directory: windows-10
        run: npm run typecheck

      - name: Payment and stock tests
        working-directory: windows-10
        run: npm run test:pdv-payments

      - name: Upgrade tests
        working-directory: windows-10
        run: npm run test:pdv-upgrade

      - name: Classic Blue contracts
        working-directory: windows-10
        run: node --test tests/pdv-classic-product-isolation.test.mjs tests/pdv-classic-blue-ui.test.mjs

      - name: Renderer build
        working-directory: windows-10
        run: npm run build:pdv-demo

      - name: Installer build
        working-directory: windows-10
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run desktop:dist:pdv

      - name: Verify legacy line untouched
        shell: pwsh
        run: |
          $after = git rev-parse HEAD:windows-7
          if ($after -ne '${{ steps.legacy.outputs.tree }}') { throw 'windows-7 tree changed' }
          git diff --exit-code HEAD -- windows-7

      - name: Verify changed paths are Windows 10 only
        shell: pwsh
        run: |
          $changed = git status --porcelain | ForEach-Object { $_.Substring(3) }
          foreach ($path in $changed) {
            if (-not $path.StartsWith('windows-10/')) { throw "Unexpected changed path: $path" }
          }
          git status --short

      - name: Commit secured Windows 10 dependency tree
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows-10/package.json windows-10/package-lock.json
          if (-not (git diff --cached --quiet)) {
            git commit -m 'security: remediate Windows 10 high vulnerabilities'
            git push origin HEAD:security/windows10-high-vulns
          }
