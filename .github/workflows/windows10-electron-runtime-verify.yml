name: Windows 10 Electron Runtime Verify

on:
  push:
    branches:
      - main
      - fix/windows10-electron-runtime-44
    paths:
      - windows-10/apps/nexus-desktop/electron-builder.cjs
      - windows-10/apps/nexus-desktop/electron-builder-pdv.cjs
      - windows-10/apps/nexus-desktop/bootstrap.cjs
      - windows-10/apps/nexus-desktop/pdv-product-identity.cjs
      - windows-10/apps/pdv-demo/src/CustomerPresentationDecor.tsx
      - windows-10/package.json
      - windows-10/package-lock.json
      - windows-10/tests/pdv-classic-product-isolation.test.mjs
      - windows-10/tests/pdv-classic-blue-ui.test.mjs
      - windows-10/tests/pdv-packaging.test.mjs
      - .github/workflows/windows10-electron-runtime-verify.yml
  pull_request:
    branches:
      - main
    paths:
      - windows-10/apps/nexus-desktop/electron-builder.cjs
      - windows-10/apps/nexus-desktop/electron-builder-pdv.cjs
      - windows-10/apps/nexus-desktop/bootstrap.cjs
      - windows-10/apps/pdv-demo/src/CustomerPresentationDecor.tsx
      - windows-10/package.json
      - windows-10/package-lock.json
      - windows-10/tests/pdv-classic-product-isolation.test.mjs
      - windows-10/tests/pdv-classic-blue-ui.test.mjs
      - windows-10/tests/pdv-packaging.test.mjs
      - .github/workflows/windows10-electron-runtime-verify.yml

permissions:
  contents: write

jobs:
  verify-runtime-and-flows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Apply product image implementation once
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $app = Get-Content -Raw "windows-10/apps/pdv-demo/src/PdvDemoApp.tsx"
          if ($app -match 'getDesktopPdvProductImageBridge') {
            Write-Host "Product image implementation already applied."
            exit 0
          }
          node windows-10/tools/apply-product-image-feature-wrapper.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows-10
          git commit -m "feat: add local product image registration"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Install Windows 10 dependencies
        working-directory: windows-10
        run: npm ci

      - name: Security audit
        working-directory: windows-10
        run: npm audit --audit-level=high

      - name: Typecheck
        working-directory: windows-10
        run: npm run typecheck

      - name: Payment stock and business tests
        working-directory: windows-10
        run: npm run test:pdv-payments

      - name: Upgrade tests
        working-directory: windows-10
        run: npm run test:pdv-upgrade

      - name: Classic Blue identity and UI contracts
        working-directory: windows-10
        run: node --test tests/pdv-classic-product-isolation.test.mjs tests/pdv-classic-blue-ui.test.mjs

      - name: Renderer build
        working-directory: windows-10
        run: npm run build:pdv-demo

      - name: Build Windows 10 installer without publishing
        working-directory: windows-10
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:pdv --workspace @nexus-core/nexus-desktop -- --publish never

      - name: Assert packaged executable uses Electron 44.4.5
        working-directory: windows-10
        shell: pwsh
        run: |
          $exe = "apps/nexus-desktop/dist-desktop/pdv-demo/win-unpacked/PDV Nexus Clássico Azul.exe"
          if (-not (Test-Path $exe)) { throw "Packaged executable not found: $exe" }
          $info = (Get-Item $exe).VersionInfo
          $version = [string]$info.ProductVersion
          Write-Host "Packaged executable ProductVersion: $version"
          if ($version -notmatch '^44\.4\.5(?:\.0)?$') { throw "Expected packaged Electron 44.4.5 metadata, got $version" }

      - name: Packaged graphical smoke through bootstrap
        working-directory: windows-10
        shell: pwsh
        run: |
          $exe = (Resolve-Path "apps/nexus-desktop/dist-desktop/pdv-demo/win-unpacked/PDV Nexus Clássico Azul.exe").Path
          $artifactDir = Join-Path $PWD "qa-artifacts-runtime44"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          $screenshot = Join-Path $artifactDir "classic-blue-packaged-smoke.png"

          $process = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(30)
            do {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) { throw "Packaged PDV exited before opening its main window. ExitCode=$($process.ExitCode)" }
            } while ($process.MainWindowHandle -eq 0 -and (Get-Date) -lt $deadline)

            $process.Refresh()
            if ($process.MainWindowHandle -eq 0) { throw "Packaged PDV did not expose a main window within 30 seconds" }
            Write-Host "MainWindowTitle: $($process.MainWindowTitle)"
            if ($process.MainWindowTitle -notmatch 'PDV Nexus Clássico Azul') {
              throw "Unexpected packaged window title: $($process.MainWindowTitle)"
            }

            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bitmap = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
            try {
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $bitmap.Save($screenshot, [System.Drawing.Imaging.ImageFormat]::Png)
            } finally {
              $graphics.Dispose()
              $bitmap.Dispose()
            }

            if (-not (Test-Path $screenshot)) { throw "Graphical smoke screenshot was not produced" }
            $size = (Get-Item $screenshot).Length
            Write-Host "Graphical smoke screenshot bytes: $size"
            if ($size -lt 1000) { throw "Graphical smoke screenshot is unexpectedly small" }
          } finally {
            if (-not $process.HasExited) {
              $null = $process.CloseMainWindow()
              if (-not $process.WaitForExit(5000)) { $process.Kill() }
            }
          }

      - name: Verify Windows 7 and 8 line untouched
        shell: pwsh
        run: |
          git fetch origin main --depth=1
          $base = git rev-parse origin/main:windows-7
          $after = git rev-parse HEAD:windows-7
          Write-Host "main windows-7 tree: $base"
          Write-Host "current windows-7 tree: $after"
          if ($after -ne $base) { throw 'windows-7 tree changed relative to main' }
