<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDV Nexus</title>
    <style data-cashier-observation-layout-fix>
      /* O bloco de observação é um filho direto do painel do pedido. Mantemos
         o layout de referência sem depender da posição ordinal desse bloco. */
      [data-shell="pdv-nexus"][data-view="caixa"][data-cashier-layout="reference-v1"] main > section > section > aside > div[data-sale-observation-anchor="true"] {
        order: 8 !important;
        grid-column: 1 !important;
        min-height: 0 !important;
        max-height: none !important;
        margin: 0 !important;
        padding: 0 !important;
        position: relative !important;
        border: 0 !important;
        border-radius: 0 !important;
        background: transparent !important;
        overflow: visible !important;
      }
      [data-shell="pdv-nexus"][data-view="caixa"][data-cashier-layout="reference-v1"] main > section > section > aside > div[data-sale-observation-anchor="true"]::before {
        content: none !important;
        display: none !important;
      }
      [data-shell="pdv-nexus"][data-view="caixa"][data-cashier-layout="reference-v1"] main > section > section > aside > div:nth-of-type(3) {
        order: 5 !important;
        grid-column: 1 !important;
        display: grid !important;
        grid-template-columns: 1fr !important;
        gap: 6px !important;
        min-height: 260px !important;
        max-height: 310px !important;
        padding: 39px 0 0 !important;
        position: relative !important;
        border: 1px solid #d9e0e8 !important;
        border-radius: 8px !important;
        background: #ffffff !important;
        overflow: auto !important;
      }
      [data-shell="pdv-nexus"][data-view="caixa"][data-cashier-layout="reference-v1"] main > section > section > aside > div:nth-of-type(3)::before {
        content: "Produto                                      Qtd.        Valor unitário          Total" !important;
        position: absolute !important;
        inset: 0 0 auto 0 !important;
        min-height: 36px !important;
        display: flex !important;
        align-items: center !important;
        padding: 0 14px !important;
        box-sizing: border-box !important;
        background: #062d57 !important;
        color: #ffffff !important;
        font-size: 10px !important;
        font-weight: 700 !important;
        white-space: pre !important;
      }
      [data-shell="pdv-nexus"][data-view="caixa"][data-cashier-layout="reference-v1"] main > section > section > aside > div:nth-of-type(3) > div {
        margin: 0 14px !important;
        padding: 9px 0 !important;
        border-radius: 0 !important;
        border-bottom: 1px solid #e4e9ef !important;
        background: transparent !important;
        font-size: 11px !important;
      }
      [data-shell="pdv-nexus"][data-view="caixa"][data-cashier-layout="reference-v1"] main > section > section > aside > div:nth-of-type(4) {
        order: 6 !important;
        grid-column: 1 !important;
        display: grid !important;
        grid-template-columns: repeat(5, minmax(0, 1fr)) !important;
        gap: 0 !important;
        padding: 0 !important;
        border: 1px solid #d9e0e8 !important;
        border-radius: 8px !important;
        overflow: hidden !important;
        background: #ffffff !important;
        min-height: auto !important;
        max-height: none !important;
        color: inherit !important;
        font-size: inherit !important;
        font-weight: inherit !important;
        text-align: initial !important;
      }
      [data-shell="pdv-nexus"][data-view="caixa"][data-cashier-layout="reference-v1"] main > section > section > aside > div:nth-of-type(4)::before {
        content: none !important;
        display: none !important;
      }
      [data-shell="pdv-nexus"][data-view="caixa"][data-cashier-layout="reference-v1"] main > section > section > aside > div:nth-of-type(4) > div {
        display: grid !important;
        gap: 3px !important;
        padding: 10px 12px !important;
        border-right: 1px solid #e4e9ef !important;
        font-size: 10px !important;
      }
      [data-shell="pdv-nexus"][data-view="caixa"][data-cashier-layout="reference-v1"] main > section > section > aside > div:nth-of-type(5) {
        order: 2 !important;
        grid-column: 2 !important;
        min-height: 112px !important;
        max-height: none !important;
        display: grid !important;
        grid-template-columns: 1fr !important;
        align-content: center !important;
        gap: 0 !important;
        padding: 38px 18px 14px !important;
        position: relative !important;
        border: 0 !important;
        border-radius: 8px 8px 0 0 !important;
        background: #062d57 !important;
        color: #ffffff !important;
        font-size: 38px !important;
        font-weight: 900 !important;
        text-align: right !important;
        box-sizing: border-box !important;
        overflow: visible !important;
      }
      [data-shell="pdv-nexus"][data-view="caixa"][data-cashier-layout="reference-v1"] main > section > section > aside > div:nth-of-type(5)::before {
        content: "TOTAL DA VENDA" !important;
        position: absolute !important;
        top: 13px !important;
        left: 16px !important;
        color: #ffffff !important;
        font-size: 11px !important;
        font-weight: 800 !important;
      }
      [data-shell="pdv-nexus"][data-view="caixa"][data-cashier-layout="reference-v1"] main > section > section > aside > div:nth-of-type(6) {
        order: 3 !important;
        grid-column: 2 !important;
        display: grid !important;
        grid-template-columns: 1fr !important;
        gap: 7px !important;
        min-height: 0 !important;
        max-height: none !important;
        margin: 0 !important;
        padding: 34px 12px 12px !important;
        position: relative !important;
        border: 1px solid #d9e0e8 !important;
        border-top: 0 !important;
        border-radius: 0 !important;
        background: #ffffff !important;
        color: inherit !important;
        font-size: inherit !important;
        font-weight: inherit !important;
        text-align: initial !important;
        overflow: visible !important;
      }
      [data-shell="pdv-nexus"][data-view="caixa"][data-cashier-layout="reference-v1"] main > section > section > aside > div:nth-of-type(6)::before {
        content: "FORMAS DE PAGAMENTO" !important;
        display: block !important;
        position: absolute !important;
        top: 11px !important;
        left: 12px !important;
        color: #2d3d52 !important;
        font-size: 9px !important;
        font-weight: 800 !important;
      }
      [data-shell="pdv-nexus"][data-view="caixa"][data-cashier-layout="reference-v1"] main > section > section > aside > div:nth-of-type(6) > button {
        min-height: 34px !important;
        justify-content: flex-start !important;
        border-radius: 6px !important;
        border: 1px solid #dce2e9 !important;
        background: #ffffff !important;
        color: #1f3048 !important;
        font-size: 10px !important;
      }
      [data-shell="pdv-nexus"][data-view="caixa"][data-cashier-layout="reference-v1"] main > section > section > aside > div:nth-of-type(6) > button:first-child {
        background: #0f4ea3 !important;
        border-color: #0f4ea3 !important;
        color: #ffffff !important;
      }
      [data-shell="pdv-nexus"][data-view="caixa"][data-cashier-layout="reference-v1"] main > section > section > aside > div:nth-of-type(7) {
        order: 4 !important;
        grid-column: 2 !important;
        min-height: 0 !important;
        max-height: none !important;
        margin-top: -12px !important;
        padding: 8px 10px !important;
        position: relative !important;
        border-radius: 0 !important;
        border: 1px solid #d9e0e8 !important;
        border-top: 0 !important;
        background: #f8fafc !important;
        color: #5c6d81 !important;
        font-size: 8px !important;
        font-weight: 600 !important;
        overflow: visible !important;
      }
      @media (max-width: 980px) {
        [data-shell="pdv-nexus"][data-view="caixa"][data-cashier-layout="reference-v1"] main > section > section > aside > div:nth-of-type(5),
        [data-shell="pdv-nexus"][data-view="caixa"][data-cashier-layout="reference-v1"] main > section > section > aside > div:nth-of-type(6),
        [data-shell="pdv-nexus"][data-view="caixa"][data-cashier-layout="reference-v1"] main > section > section > aside > div:nth-of-type(7) {
          grid-column: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
