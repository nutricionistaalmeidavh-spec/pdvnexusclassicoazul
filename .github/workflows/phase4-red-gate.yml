name: Phase 4 Classic Blue RED

on:
  push:
    branches:
      - work/fases-4-7-classico-azul
    paths:
      - .github/workflows/phase4-red-gate.yml

permissions:
  contents: read

jobs:
  red:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/fases-4-7-classico-azul
      - name: Verify Windows 10 classic UI test is RED
        shell: pwsh
        run: |
          Push-Location windows-10
          node --test tests/pdv-classic-blue-ui.test.mjs *> "$env:RUNNER_TEMP\classic-red-w10.log"
          $code10=$LASTEXITCODE
          Pop-Location
          Get-Content "$env:RUNNER_TEMP\classic-red-w10.log" | Select-Object -Last 40
          if($code10 -eq 0){ throw 'Expected Windows 10 classic UI contract to fail before implementation' }
          $global:LASTEXITCODE=0
      - name: Verify Windows 7 classic UI test is RED
        shell: pwsh
        run: |
          Push-Location windows-7
          node --test tests/pdv-classic-blue-ui.test.mjs *> "$env:RUNNER_TEMP\classic-red-w7.log"
          $code7=$LASTEXITCODE
          Pop-Location
          Get-Content "$env:RUNNER_TEMP\classic-red-w7.log" | Select-Object -Last 40
          if($code7 -eq 0){ throw 'Expected Windows 7 classic UI contract to fail before implementation' }
          $global:LASTEXITCODE=0
      - name: Confirm RED
        run: echo "Classic Blue UI contracts are RED before implementation."
