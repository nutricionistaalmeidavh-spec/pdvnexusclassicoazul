name: Final Merge Verification and Audit

on:
  push:
    branches:
      - work/fases-4-7-classico-azul
    paths:
      - .github/workflows/final-merge-audit.yml

permissions:
  contents: read

jobs:
  verify-and-audit:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/fases-4-7-classico-azul
          fetch-depth: 0

      - name: Windows 10 install
        working-directory: windows-10
        run: npm ci
      - name: Windows 10 typecheck
        working-directory: windows-10
        run: npm run typecheck
      - name: Windows 10 payment and stock tests
        working-directory: windows-10
        run: npm run test:pdv-payments
      - name: Windows 10 upgrade tests
        working-directory: windows-10
        run: npm run test:pdv-upgrade
      - name: Windows 10 Classic Blue contracts
        working-directory: windows-10
        run: node --test tests/pdv-classic-product-isolation.test.mjs tests/pdv-classic-blue-ui.test.mjs
      - name: Windows 10 build
        working-directory: windows-10
        run: npm run build:pdv-demo
      - name: Windows 10 audit details
        shell: pwsh
        working-directory: windows-10
        run: |
          npm audit --json | Set-Content -Encoding UTF8 audit.json
          $audit = Get-Content audit.json -Raw | ConvertFrom-Json
          Write-Host '=== WINDOWS 10 AUDIT SUMMARY ==='
          $audit.metadata.vulnerabilities | ConvertTo-Json -Compress
          Write-Host '=== WINDOWS 10 VULNERABILITIES ==='
          foreach ($p in $audit.vulnerabilities.PSObject.Properties) {
            $v = $p.Value
            if ($v.severity -in @('high','critical')) {
              Write-Host ('PACKAGE=' + $p.Name)
              Write-Host ('SEVERITY=' + $v.severity)
              Write-Host ('DIRECT=' + $v.isDirect)
              Write-Host ('RANGE=' + $v.range)
              Write-Host ('NODES=' + (($v.nodes) -join ','))
              Write-Host ('FIX=' + (($v.fixAvailable | ConvertTo-Json -Compress)))
              foreach ($via in $v.via) {
                if ($via -is [string]) { Write-Host ('VIA=' + $via) }
                else { Write-Host ('VIA=' + $via.name + '|' + $via.title + '|' + $via.url + '|' + $via.range) }
              }
            }
          }
        continue-on-error: true

      - name: Legacy install
        working-directory: windows-7
        run: npm ci
      - name: Legacy typecheck
        working-directory: windows-7
        run: npm run typecheck
      - name: Legacy payment and stock tests
        working-directory: windows-7
        run: npm run test:pdv-payments
      - name: Legacy upgrade tests
        working-directory: windows-7
        run: npm run test:pdv-upgrade
      - name: Legacy Classic Blue contracts
        working-directory: windows-7
        run: node --test tests/pdv-classic-product-isolation.test.mjs tests/pdv-classic-legacy-builder-isolation.test.mjs tests/pdv-classic-blue-ui.test.mjs
      - name: Legacy build
        working-directory: windows-7
        run: npm run build:pdv-demo
      - name: Legacy audit details
        shell: pwsh
        working-directory: windows-7
        run: |
          npm audit --json | Set-Content -Encoding UTF8 audit.json
          $audit = Get-Content audit.json -Raw | ConvertFrom-Json
          Write-Host '=== LEGACY AUDIT SUMMARY ==='
          $audit.metadata.vulnerabilities | ConvertTo-Json -Compress
          Write-Host '=== LEGACY VULNERABILITIES ==='
          foreach ($p in $audit.vulnerabilities.PSObject.Properties) {
            $v = $p.Value
            if ($v.severity -in @('high','critical')) {
              Write-Host ('PACKAGE=' + $p.Name)
              Write-Host ('SEVERITY=' + $v.severity)
              Write-Host ('DIRECT=' + $v.isDirect)
              Write-Host ('RANGE=' + $v.range)
              Write-Host ('NODES=' + (($v.nodes) -join ','))
              Write-Host ('FIX=' + (($v.fixAvailable | ConvertTo-Json -Compress)))
              foreach ($via in $v.via) {
                if ($via -is [string]) { Write-Host ('VIA=' + $via) }
                else { Write-Host ('VIA=' + $via.name + '|' + $via.title + '|' + $via.url + '|' + $via.range) }
              }
            }
          }
        continue-on-error: true
