name: Phase 3 Graphical Smoke

on:
  push:
    branches:
      - work/fases-0-3-classico-azul
    paths:
      - .github/workflows/phase3-graphical-smoke.yml

permissions:
  contents: read

jobs:
  graphical-smoke:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
        working-directory: windows-10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/fases-0-3-classico-azul
          fetch-depth: 0
      - name: Install PDV dependencies
        run: npm ci
      - name: Install ArtiSys QA dependencies
        run: npm ci --prefix tools/artisys-qa
      - name: Build PDV renderer
        run: npm run build:pdv-demo
      - name: Create Phase 3 bootstrap QA config
        run: |
          $config=Get-Content qa/artisys-qa.config.json -Raw | ConvertFrom-Json
          $config.electron.entry='../apps/nexus-desktop/bootstrap.cjs'
          $config.capture.screenshotEachStep=$true
          $config | ConvertTo-Json -Depth 20 | Set-Content -Encoding UTF8 qa/artisys-qa.phase3.config.json
      - name: Validate bootstrap QA config
        run: node tools/artisys-qa/src/cli.mjs validate --config qa/artisys-qa.phase3.config.json
      - name: Launch real bootstrap and execute graphical UI review
        run: node tools/artisys-qa/src/cli.mjs run --config qa/artisys-qa.phase3.config.json --flow ui-review --output qa-phase3-graphical-smoke
      - name: Verify graphical evidence
        run: |
          $summary=Get-ChildItem qa-phase3-graphical-smoke -Recurse -Filter summary.json | Select-Object -First 1
          if(-not $summary){
            $summary=Get-ChildItem qa-phase3-graphical-smoke -Recurse -Filter '*summary*.json' | Select-Object -First 1
          }
          if(-not $summary){throw 'Graphical QA summary not found'}
          Write-Host "Graphical QA summary: $($summary.FullName)"
          Get-Content $summary.FullName
          $png=Get-ChildItem qa-phase3-graphical-smoke -Recurse -Filter '*.png' | Select-Object -First 1
          if(-not $png){throw 'No graphical screenshot evidence was produced'}
          Write-Host "Screenshot evidence: $($png.FullName)"
