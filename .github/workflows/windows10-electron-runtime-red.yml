name: Windows 10 Electron Runtime RED

on:
  push:
    branches:
      - fix/windows10-electron-runtime-44
    paths:
      - windows-10/tests/pdv-classic-product-isolation.test.mjs
      - .github/workflows/windows10-electron-runtime-red.yml

permissions:
  contents: read

jobs:
  runtime-red:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows10-electron-runtime-44
      - name: RED - packaged runtime must match secured Electron
        working-directory: windows-10
        run: node --test tests/pdv-classic-product-isolation.test.mjs
