name: Windows 10 Electron Runtime Verify

on:
  push:
    branches:
      - fix/windows10-electron-runtime-44
    paths:
      - windows-10/apps/nexus-desktop/electron-builder.cjs
      - windows-10/package.json
      - windows-10/package-lock.json
      - windows-10/tests/pdv-classic-product-isolation.test.mjs
      - .github/workflows/windows10-electron-runtime-verify.yml

permissions:
  contents: read

jobs:
  verify-runtime-and-flows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows10-electron-runtime-44
          fetch-depth: 0

      - name: Capture legacy tree
        id: legacy
        shell: pwsh
        run: |
          $tree = git rev-parse HEAD:windows-7
          "tree=$tree" >> $env:GITHUB_OUTPUT
          Write-Host "Legacy tree: $tree"

      - name: Install Windows 10 dependencies
        working-directory: windows-10
        run: npm ci

      - name: Security audit
        working-directory: windows-10
        run: npm audit --audit-level=high

      - name: Typecheck
        working-directory: windows-10
        run: npm run typecheck

      - name: Payment stock and business tests
        working-directory: windows-10
        run: npm run test:pdv-payments

      - name: Upgrade tests
        working-directory: windows-10
        run: npm run test:pdv-upgrade

      - name: Classic Blue identity and UI contracts
        working-directory: windows-10
        run: node --test tests/pdv-classic-product-isolation.test.mjs tests/pdv-classic-blue-ui.test.mjs

      - name: Renderer build
        working-directory: windows-10
        run: npm run build:pdv-demo

      - name: Build Windows 10 installer without publishing
        working-directory: windows-10
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:pdv --workspace @nexus-core/nexus-desktop -- --publish never

      - name: Assert packaged executable uses Electron 44.4.5
        working-directory: windows-10
        shell: pwsh
        run: |
          $exe = "apps/nexus-desktop/dist-desktop/pdv-demo/win-unpacked/PDV Nexus Clássico Azul.exe"
          if (-not (Test-Path $exe)) { throw "Packaged executable not found: $exe" }
          $versionFile = Join-Path $PWD "packaged-electron-version.txt"
          $env:ELECTRON_RUN_AS_NODE = "1"
          $env:PDV_RUNTIME_VERSION_FILE = $versionFile
          & $exe -e "require('fs').writeFileSync(process.env.PDV_RUNTIME_VERSION_FILE, process.versions.electron || '')"
          if ($LASTEXITCODE -ne 0) { throw "Packaged executable version probe failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path $versionFile)) { throw "Packaged runtime version file was not produced" }
          $version = (Get-Content $versionFile -Raw).Trim()
          Write-Host "Packaged Electron runtime: $version"
          if ($version -ne "44.4.5") { throw "Expected packaged Electron 44.4.5, got $version" }

      - name: Install ArtiSys QA runtime
        working-directory: windows-10
        run: npm ci --prefix tools/artisys-qa

      - name: Prepare bootstrap graphical smoke config
        working-directory: windows-10
        shell: pwsh
        run: |
          $config = Get-Content qa/artisys-qa.config.json -Raw | ConvertFrom-Json
          $config.electron.entry = "../apps/nexus-desktop/bootstrap.cjs"
          $config.flows | Add-Member -NotePropertyName "ui-review-classic-blue" -NotePropertyValue "flows/ui-review-classic-blue.json" -Force
          $config | ConvertTo-Json -Depth 20 | Set-Content -Encoding UTF8 qa/artisys-qa.runtime44.config.json

      - name: Validate graphical smoke config
        working-directory: windows-10
        run: node tools/artisys-qa/src/cli.mjs validate --config qa/artisys-qa.runtime44.config.json

      - name: Graphical smoke through bootstrap
        working-directory: windows-10
        run: node tools/artisys-qa/src/cli.mjs run --config qa/artisys-qa.runtime44.config.json --flow ui-review-classic-blue --output qa-artifacts-runtime44

      - name: Verify graphical smoke evidence
        working-directory: windows-10
        shell: pwsh
        run: |
          if (-not (Test-Path qa-artifacts-runtime44/run-summary.json)) { throw "run-summary.json missing" }
          $screenshots = Get-ChildItem qa-artifacts-runtime44 -Recurse -Filter *.png
          if ($screenshots.Count -lt 1) { throw "No graphical screenshot produced" }
          Write-Host "Graphical screenshots: $($screenshots.Count)"

      - name: Verify Windows 7 and 8 line untouched
        shell: pwsh
        run: |
          $after = git rev-parse HEAD:windows-7
          if ($after -ne '${{ steps.legacy.outputs.tree }}') { throw 'windows-7 tree changed' }
          git diff --exit-code HEAD -- windows-7
