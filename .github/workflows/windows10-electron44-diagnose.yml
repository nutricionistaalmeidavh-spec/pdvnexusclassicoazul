name: Windows 10 Electron 44 Diagnose

on:
  push:
    branches:
      - fix/windows10-electron-runtime-44
    paths:
      - .github/workflows/windows10-electron44-diagnose.yml

permissions:
  contents: read

jobs:
  diagnose-main-process:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows10-electron-runtime-44
      - name: Install Windows 10 dependencies
        working-directory: windows-10
        run: npm ci
      - name: Build renderer
        working-directory: windows-10
        run: npm run build:pdv-demo
      - name: Confirm Electron 44 works before packaging
        working-directory: windows-10
        shell: pwsh
        run: |
          $env:NEXUS_APP = "pdv-demo"
          $electronOutput = @(node -p "require('electron')")
          $exe = ([string]($electronOutput | Select-Object -Last 1)).Trim()
          $process = Start-Process -FilePath $exe -ArgumentList @("apps/nexus-desktop") -PassThru
          Start-Sleep -Seconds 6
          $process.Refresh()
          Write-Host "Development MainWindowTitle=$($process.MainWindowTitle)"
          if ($process.HasExited -or $process.MainWindowTitle -eq "Error") { throw "Electron 44 development launch failed" }
          $null = $process.CloseMainWindow()
          if (-not $process.WaitForExit(3000)) { $process.Kill() }
      - name: Build unpacked Windows package
        working-directory: windows-10
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:pdv --workspace @nexus-core/nexus-desktop -- --dir --publish never
      - name: Inspect packaged native modules
        working-directory: windows-10
        shell: pwsh
        run: |
          $unpacked = "apps/nexus-desktop/dist-desktop/pdv-demo/win-unpacked/resources/app.asar.unpacked"
          Write-Host "=== app.asar.unpacked ==="
          if (Test-Path $unpacked) {
            Get-ChildItem $unpacked -Recurse -File | Select-Object -ExpandProperty FullName | Select-Object -First 200
          } else {
            Write-Host "No app.asar.unpacked directory"
          }
      - name: Launch packaged Electron 44 and capture startup diagnostics
        working-directory: windows-10
        shell: pwsh
        run: |
          $env:ELECTRON_ENABLE_LOGGING = "1"
          $env:ELECTRON_ENABLE_STACK_DUMPING = "1"
          $exe = (Resolve-Path "apps/nexus-desktop/dist-desktop/pdv-demo/win-unpacked/PDV Nexus Clássico Azul.exe").Path
          $stdout = Join-Path $PWD "packaged44-stdout.log"
          $stderr = Join-Path $PWD "packaged44-stderr.log"
          $process = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 8
          $process.Refresh()
          $title = $process.MainWindowTitle
          Write-Host "HasExited=$($process.HasExited) MainWindowTitle=$title MainWindowHandle=$($process.MainWindowHandle)"
          Write-Host "=== PACKAGED STDERR ==="
          if (Test-Path $stderr) { Get-Content $stderr -Raw }
          Write-Host "=== PACKAGED STDOUT ==="
          if (Test-Path $stdout) { Get-Content $stdout -Raw }
          if (-not $process.HasExited) {
            $null = $process.CloseMainWindow()
            if (-not $process.WaitForExit(3000)) { $process.Kill() }
          }
          if ($title -eq "Error") { throw "Packaged Electron 44 opened main-process Error dialog; diagnostics printed above" }
