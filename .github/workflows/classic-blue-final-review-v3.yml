name: Classic Blue Final Review v3

on:
  push:
    branches:
      - work/fases-0-3-classico-azul
    paths:
      - .github/workflows/classic-blue-final-review-v3.yml

permissions:
  contents: read

env:
  SOURCE_REPO: nutricionistaalmeidavh-spec/PDVNexus
  SOURCE_SHA: 07d7bba2f184e298cb53fa1d3d1a24b37539e844

jobs:
  final-review:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated destination branch
        uses: actions/checkout@v4
        with:
          ref: work/fases-0-3-classico-azul
          fetch-depth: 0

      - name: Clone frozen source read-only and supply release contract locally
        shell: pwsh
        run: |
          git clone --filter=blob:none "https://github.com/$env:SOURCE_REPO.git" "$env:RUNNER_TEMP\source-review"
          git -C "$env:RUNNER_TEMP\source-review" checkout --detach $env:SOURCE_SHA
          if ((git -C "$env:RUNNER_TEMP\source-review" rev-parse HEAD) -ne $env:SOURCE_SHA) { throw 'source SHA mismatch' }
          git -C "$env:RUNNER_TEMP\source-review" remote set-url --push origin DISABLED
          Copy-Item "$env:RUNNER_TEMP\source-review\.github\workflows\publish-pdv-release.yml" .github\workflows\publish-pdv-release.yml -Force

      - name: Verify UI files are byte-equivalent to frozen source
        shell: pwsh
        run: |
          $a=(git hash-object windows-10/apps/pdv-demo/src/PdvDemoApp.tsx)
          $b=(git -C "$env:RUNNER_TEMP\source-review" hash-object windows-10/apps/pdv-demo/src/PdvDemoApp.tsx)
          if ($a -ne $b) { throw 'Windows 10 UI changed unexpectedly' }
          $a=(git hash-object windows-7/apps/pdv-demo/src/PdvDemoApp.tsx)
          $b=(git -C "$env:RUNNER_TEMP\source-review" hash-object windows-7/apps/pdv-demo/src/PdvDemoApp.tsx)
          if ($a -ne $b) { throw 'Windows 7 UI changed unexpectedly' }
          Write-Host 'UI hash comparison: PASS'

      - name: Install exact dependencies in this fresh review job
        working-directory: windows-10
        run: npm ci

      - name: Final aggregate gate
        shell: cmd
        working-directory: windows-10
        run: npm run typecheck && npm run test:pdv-payments && npm run test:pdv-upgrade && node --test tests/pdv-classic-product-isolation.test.mjs && npm run build:pdv-demo

      - name: Final dangerous-reference scan
        shell: pwsh
        run: |
          $files=@(
            'pdv-release.json',
            'windows-10/apps/nexus-desktop/bootstrap.cjs',
            'windows-10/apps/nexus-desktop/main.cjs',
            'windows-10/apps/nexus-desktop/electron-builder.cjs',
            'windows-10/apps/nexus-desktop/electron-builder-pdv.cjs',
            'windows-7/apps/nexus-desktop/bootstrap.cjs',
            'windows-7/apps/nexus-desktop/main.cjs',
            'windows-7/apps/nexus-desktop/electron-builder.cjs',
            'windows-7/apps/nexus-desktop/electron-builder-pdv.cjs'
          )
          $matches=Select-String -Path $files -Pattern 'com.nexuscore.pdv|PDV-Nexus-Setup|PDVNexus/releases/latest/download|1M0_SfF1h_zUqEM-Ns1HJ8ZtCMMcbHnFr'
          if($matches){$matches|Format-Table;throw 'dangerous original runtime reference remains'}
          Write-Host 'Final isolation reference scan: PASS'

      - name: Verify baseline evidence exists
        shell: pwsh
        run: |
          if (-not (Test-Path docs/baseline-fases-0-3.md)) { throw 'baseline evidence missing' }
          Get-Content docs/baseline-fases-0-3.md
