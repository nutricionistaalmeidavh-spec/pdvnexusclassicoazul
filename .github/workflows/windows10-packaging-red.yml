name: Windows 10 Packaging RED

on:
  push:
    branches:
      - fix/windows10-electron-runtime-44
    paths:
      - windows-10/apps/pdv-demo/src/CustomerPresentationDecor.tsx
      - windows-10/tests/pdv-classic-blue-ui.test.mjs
      - .github/workflows/windows10-packaging-red.yml

permissions:
  contents: read

jobs:
  packaging-red:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows10-electron-runtime-44
      - name: RED - renderer must keep Classic Blue title
        working-directory: windows-10
        run: node --test tests/pdv-classic-blue-ui.test.mjs
