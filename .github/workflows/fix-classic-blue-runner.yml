name: Fix Classic Blue Runner

on:
  push:
    branches:
      - work/fases-0-3-classico-azul
    paths:
      - .github/workflows/fix-classic-blue-runner.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/fases-0-3-classico-azul
          fetch-depth: 0
      - name: Normalize remote gate and remove temporary fixer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/classic-blue-execute-fases-0-3.yml')
          s = p.read_text(encoding='utf-8')
          old = '          test "$(git remote get-url origin)" = "https://github.com/nutricionistaalmeidavh-spec/pdvnexusclassicoazul.git"\n'
          new = '          remote_url="$(git remote get-url origin)"\n          remote_url="${remote_url%.git}"\n          test "$remote_url" = "https://github.com/nutricionistaalmeidavh-spec/pdvnexusclassicoazul"\n'
          if old not in s:
              raise SystemExit('expected remote gate not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-classic-blue-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: accept normalized destination remote URL"
          git push origin HEAD:work/fases-0-3-classico-azul
