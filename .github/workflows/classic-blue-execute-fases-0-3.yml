name: Execute Classic Blue Phases 0-3

on:
  push:
    branches:
      - work/fases-0-3-classico-azul
    paths:
      - .github/workflows/classic-blue-execute-fases-0-3.yml

permissions:
  contents: write

env:
  SOURCE_REPO: nutricionistaalmeidavh-spec/PDVNexus
  SOURCE_SHA: 07d7bba2f184e298cb53fa1d3d1a24b37539e844
  TARGET_BRANCH: work/fases-0-3-classico-azul

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated destination branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Import exact source snapshot without source git metadata
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/pdvnexus-source-readonly"
          git clone --filter=blob:none "https://github.com/${SOURCE_REPO}.git" "$SRC"
          git -C "$SRC" checkout --detach "$SOURCE_SHA"
          test "$(git -C "$SRC" rev-parse HEAD)" = "$SOURCE_SHA"
          git -C "$SRC" remote set-url --push origin DISABLED

          git -C "$SRC" archive "$SOURCE_SHA" | tar -x -f -
          rm -f .github/workflows/classic-blue-execute-fases-0-3.yml

          cat > SOURCE_PROVENANCE.md <<'EOF'
          source_repository=nutricionistaalmeidavh-spec/PDVNexus
          source_branch=main
          source_commit=07d7bba2f184e298cb53fa1d3d1a24b37539e844
          destination_repository=nutricionistaalmeidavh-spec/pdvnexusclassicoazul
          EOF

          python - <<'PY'
          import os, subprocess
          src = os.environ['RUNNER_TEMP'] + '/pdvnexus-source-readonly'
          source = set(subprocess.check_output(['git','-C',src,'ls-files'], text=True).splitlines())
          extras = {
              'SOURCE_PROVENANCE.md',
              'docs/superpowers/specs/2026-09-26-pdv-nexus-classico-azul-bootstrap-design.md',
              'docs/superpowers/plans/2026-09-26-pdv-nexus-classico-azul-fases-0-3.md',
          }
          actual = set()
          for root, dirs, files in os.walk('.'):
              if '.git' in dirs:
                  dirs.remove('.git')
              for name in files:
                  path = os.path.relpath(os.path.join(root, name), '.').replace('\\','/')
                  actual.add(path)
          expected = source | extras
          missing = sorted(expected - actual)
          unexpected = sorted(actual - expected)
          if missing or unexpected:
              raise SystemExit(f'path mismatch\nmissing={missing[:20]}\nunexpected={unexpected[:20]}')
          for required in ['windows-10/package.json','windows-7/package.json','.github/workflows/publish-pdv-release.yml','pdv-release.json']:
              assert required in actual, required
          print(f'import path verification OK: {len(source)} source paths + {len(extras)} destination-only paths')
          PY

          echo '--- destination remotes ---'
          git remote -v
          test "$(git remote get-url origin)" = "https://github.com/nutricionistaalmeidavh-spec/pdvnexusclassicoazul.git"
          ! git remote -v | grep -F 'nutricionistaalmeidavh-spec/PDVNexus.git'

      - name: Commit Task 1 snapshot import
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: import PDV Nexus snapshot for classic blue edition"

      - name: Write isolation tests first
        shell: bash
        run: |
          set -euo pipefail
          for line in windows-10 windows-7; do
            cat > "$line/tests/pdv-classic-product-isolation.test.mjs" <<'EOF'
          import assert from "node:assert/strict";
          import fs from "node:fs";
          import path from "node:path";
          import { createRequire } from "node:module";
          import { fileURLToPath } from "node:url";
          import test from "node:test";

          const require = createRequire(import.meta.url);
          const desktopDir = fileURLToPath(new URL("../apps/nexus-desktop/", import.meta.url));
          const identityPath = path.join(desktopDir, "pdv-product-identity.cjs");
          const bootstrapPath = path.join(desktopDir, "bootstrap.cjs");
          const mainPath = path.join(desktopDir, "main.cjs");
          const builderPath = path.join(desktopDir, "electron-builder.cjs");
          const pdvBuilderPath = path.join(desktopDir, "electron-builder-pdv.cjs");
          const releasePath = fileURLToPath(new URL("../../pdv-release.json", import.meta.url));

          test("classic blue identity module sets isolated name and userData", () => {
            assert.equal(fs.existsSync(identityPath), true, "pdv-product-identity.cjs must exist");
            const { applyPdvProductIdentity } = require(identityPath);
            const calls = [];
            const fakeApp = {
              getPath(name) { assert.equal(name, "appData"); return "C:\\Users\\qa\\AppData\\Roaming"; },
              setName(value) { calls.push(["name", value]); },
              setPath(name, value) { calls.push([name, value]); }
            };
            applyPdvProductIdentity(fakeApp, path.win32);
            assert.deepEqual(calls[0], ["name", "PDV Nexus Clássico Azul"]);
            assert.equal(calls[1][0], "userData");
            assert.equal(path.win32.basename(calls[1][1]), "PDV Nexus Classico Azul");
          });

          test("electron builder gives pdv-demo an independent Windows identity", () => {
            process.env.NEXUS_APP = "pdv-demo";
            delete require.cache[require.resolve(builderPath)];
            const config = require(builderPath);
            assert.equal(config.appId, "com.artisys.pdvnexus.classicoazul");
            assert.equal(config.productName, "PDV Nexus Clássico Azul");
            assert.equal(config.artifactName, "PDV-Nexus-Classico-Azul-Setup-${version}.${ext}");
            assert.equal(config.nsis.shortcutName, "PDV Nexus Clássico Azul");
          });

          test("bootstrap applies classic identity before migration touches userData", () => {
            const source = fs.readFileSync(bootstrapPath, "utf8");
            const applyIndex = source.indexOf("applyPdvProductIdentity(app, path)");
            const migrationIndex = source.indexOf("preparePdvVersionMigration({");
            assert.ok(applyIndex >= 0, "bootstrap must apply classic identity");
            assert.ok(migrationIndex >= 0, "bootstrap must retain migration guard");
            assert.ok(applyIndex < migrationIndex, "identity must be applied before migration reads userData");
          });

          test("runtime title is classic blue", () => {
            const source = fs.readFileSync(mainPath, "utf8");
            assert.match(source, /"pdv-demo":\s*\{\s*title:\s*"PDV Nexus Clássico Azul"/m);
          });

          test("pdv package metadata does not embed original updater", () => {
            process.env.NEXUS_APP = "pdv-demo";
            delete require.cache[require.resolve(pdvBuilderPath)];
            const config = require(pdvBuilderPath);
            assert.equal(config.extraMetadata?.pdvUpdateChannel, undefined);
            assert.equal(config.extraMetadata?.pdvUpdateManifestUrl, undefined);
            const release = JSON.parse(fs.readFileSync(releasePath, "utf8"));
            assert.equal(release.version, "0.1.19");
            assert.equal(release.manifestUrl, null);
            assert.deepEqual(release.distribution, {});
            const serialized = JSON.stringify(release);
            assert.doesNotMatch(serialized, /PDVNexus\/releases\/latest\/download/);
            assert.doesNotMatch(serialized, /1M0_SfF1h_zUqEM-Ns1HJ8ZtCMMcbHnFr/);
          });
          EOF
          done

      - name: Verify RED before implementation
        shell: bash
        run: |
          set +e
          (cd windows-10 && node --test tests/pdv-classic-product-isolation.test.mjs) > "$RUNNER_TEMP/red-win10.log" 2>&1
          rc10=$?
          (cd windows-7 && node --test tests/pdv-classic-product-isolation.test.mjs) > "$RUNNER_TEMP/red-win7.log" 2>&1
          rc7=$?
          set -e
          echo "windows-10 RED exit=$rc10"
          tail -n 30 "$RUNNER_TEMP/red-win10.log"
          echo "windows-7 RED exit=$rc7"
          tail -n 30 "$RUNNER_TEMP/red-win7.log"
          test "$rc10" -ne 0
          test "$rc7" -ne 0

      - name: Implement independent product identity after RED
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          for line in ('windows-10', 'windows-7'):
              desktop = Path(line) / 'apps/nexus-desktop'
              identity = desktop / 'pdv-product-identity.cjs'
              identity.write_text('''function applyPdvProductIdentity(app, pathModule) {\n  app.setName("PDV Nexus Clássico Azul");\n  app.setPath("userData", pathModule.join(app.getPath("appData"), "PDV Nexus Classico Azul"));\n}\n\nmodule.exports = { applyPdvProductIdentity };\n''', encoding='utf-8')

              bootstrap = desktop / 'bootstrap.cjs'
              text = bootstrap.read_text(encoding='utf-8-sig')
              needle = 'const { preparePdvVersionMigration, startPdvAutoUpdater } = require("./pdv-lifecycle.cjs");\n'
              if 'pdv-product-identity.cjs' not in text:
                  assert needle in text
                  text = text.replace(needle, needle + 'const { applyPdvProductIdentity } = require("./pdv-product-identity.cjs");\n', 1)
              marker = 'const isPdv = process.env.NEXUS_APP === "pdv-demo" || Boolean(pkg.pdvUpdateChannel);\n'
              if 'applyPdvProductIdentity(app, path);' not in text:
                  assert marker in text
                  text = text.replace(marker, marker + 'if (isPdv) {\n  applyPdvProductIdentity(app, path);\n}\n', 1)
              bootstrap.write_text(text, encoding='utf-8')

              main = desktop / 'main.cjs'
              text = main.read_text(encoding='utf-8-sig')
              old = '"pdv-demo": {\n    title: "PDV Nexus"\n  }'
              new = '"pdv-demo": {\n    title: "PDV Nexus Clássico Azul"\n  }'
              assert old in text
              main.write_text(text.replace(old, new, 1), encoding='utf-8')

              builder = desktop / 'electron-builder.cjs'
              text = builder.read_text(encoding='utf-8-sig')
              replacements = {
                  'appId: "com.nexuscore.pdv"': 'appId: "com.artisys.pdvnexus.classicoazul"',
                  'productName: "PDV Nexus"': 'productName: "PDV Nexus Clássico Azul"',
                  'artifactName: "PDV-Nexus-Setup-${version}.${ext}"': 'artifactName: "PDV-Nexus-Classico-Azul-Setup-${version}.${ext}"',
                  'shortcutName: "PDV Nexus"': 'shortcutName: selectedKey === "pdv-demo" ? "PDV Nexus Clássico Azul" : "PDV Nexus"',
              }
              for old_value, new_value in replacements.items():
                  assert old_value in text, (line, old_value)
                  text = text.replace(old_value, new_value, 1)
              builder.write_text(text, encoding='utf-8')

              pdv_builder = desktop / 'electron-builder-pdv.cjs'
              pdv_builder.write_text('''process.env.NEXUS_APP = "pdv-demo";\nconst release = require("../../../pdv-release.json");\nconst base = require("./electron-builder.cjs");\n\nmodule.exports = {\n  ...base,\n  extraMetadata: {\n    ...(base.extraMetadata || {}),\n    version: release.version\n  }\n};\n''', encoding='utf-8')

          release = Path('pdv-release.json')
          current = json.loads(release.read_text(encoding='utf-8-sig'))
          assert current['schemaVersion'] == 1
          assert current['version'] == '0.1.19'
          release.write_text(json.dumps({
              'schemaVersion': 1,
              'version': '0.1.19',
              'manifestUrl': None,
              'distribution': {}
          }, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY

      - name: Verify GREEN and runtime-reference isolation
        shell: bash
        run: |
          set -euo pipefail
          (cd windows-10 && node --test tests/pdv-classic-product-isolation.test.mjs)
          (cd windows-7 && node --test tests/pdv-classic-product-isolation.test.mjs)

          for line in windows-10 windows-7; do
            files=(
              "$line/apps/nexus-desktop/bootstrap.cjs"
              "$line/apps/nexus-desktop/main.cjs"
              "$line/apps/nexus-desktop/electron-builder.cjs"
              "$line/apps/nexus-desktop/electron-builder-pdv.cjs"
              "$line/apps/nexus-desktop/pdv-product-identity.cjs"
              "pdv-release.json"
            )
            ! grep -F 'com.nexuscore.pdv' "${files[@]}"
            ! grep -F 'PDV-Nexus-Setup' "${files[@]}"
            ! grep -F 'PDVNexus/releases/latest/download' "${files[@]}"
            ! grep -F '1M0_SfF1h_zUqEM-Ns1HJ8ZtCMMcbHnFr' "${files[@]}"
          done

      - name: Commit Task 2 isolation and push implementation commits
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "feat: isolate PDV Nexus classic blue product identity"
          git push origin "HEAD:${TARGET_BRANCH}"

  baseline-windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout prepared branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Install exact dependencies
        working-directory: windows-10
        run: npm ci

      - name: Typecheck
        working-directory: windows-10
        run: npm run typecheck

      - name: Payment tests
        working-directory: windows-10
        run: npm run test:pdv-payments

      - name: Upgrade and release-contract tests
        working-directory: windows-10
        run: npm run test:pdv-upgrade

      - name: Classic product isolation test
        working-directory: windows-10
        run: node --test tests/pdv-classic-product-isolation.test.mjs

      - name: Build PDV renderer
        working-directory: windows-10
        run: npm run build:pdv-demo

      - name: Automated desktop identity smoke
        shell: pwsh
        run: |
          $script = @'
          const path = require('node:path');
          const { applyPdvProductIdentity } = require('./windows-10/apps/nexus-desktop/pdv-product-identity.cjs');
          const calls = [];
          const app = {
            getPath(name) { if (name !== 'appData') throw new Error('unexpected path'); return 'C:\\Users\\qa\\AppData\\Roaming'; },
            setName(value) { calls.push(['name', value]); },
            setPath(name, value) { calls.push([name, value]); }
          };
          applyPdvProductIdentity(app, path.win32);
          if (calls[0][1] !== 'PDV Nexus Clássico Azul') process.exit(2);
          if (path.win32.basename(calls[1][1]) !== 'PDV Nexus Classico Azul') process.exit(3);
          console.log(JSON.stringify(calls));
          '@
          node -e $script
          Write-Host 'Graphical Electron window smoke is not claimed on the non-interactive hosted runner.'

      - name: Record Task 3 baseline evidence and push
        shell: pwsh
        run: |
          $testedSha = git rev-parse HEAD
          @"
          # Baseline — fases 0–3

          - Source repository: `nutricionistaalmeidavh-spec/PDVNexus`
          - Source snapshot: `07d7bba2f184e298cb53fa1d3d1a24b37539e844`
          - Destination repository: `nutricionistaalmeidavh-spec/pdvnexusclassicoazul`
          - Destination branch: `work/fases-0-3-classico-azul`
          - Tested destination SHA: `$testedSha`
          - Runner: GitHub Actions `windows-latest`

          ## Gates

          - `npm ci`: PASS
          - `npm run typecheck`: PASS
          - `npm run test:pdv-payments`: PASS
          - `npm run test:pdv-upgrade`: PASS
          - `node --test tests/pdv-classic-product-isolation.test.mjs`: PASS
          - `npm run build:pdv-demo`: PASS
          - Automated identity/userData smoke: PASS
          - Graphical Electron window smoke: NOT CLAIMED (hosted runner is non-interactive)

          ## Isolation

          - Product appId: `com.artisys.pdvnexus.classicoazul`
          - Product name: `PDV Nexus Clássico Azul`
          - userData basename: `PDV Nexus Classico Azul`
          - Original PDVNexus updater metadata: disabled in this baseline
          - GitHub release publication: not executed by this workflow
          - Google Drive publication: not executed by this workflow
          - Source repository writes: none; source was cloned detached at the frozen SHA and its push URL was disabled

          The visual UI has not been changed in phases 0–3.
          "@ | Set-Content -Encoding UTF8 docs/baseline-fases-0-3.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/baseline-fases-0-3.md
          git commit -m "test: record classic blue baseline gates"
          git push origin "HEAD:$env:TARGET_BRANCH"

  final-review:
    needs: baseline-windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout final branch state
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Clone frozen source for scope review
        shell: pwsh
        run: |
          git clone --filter=blob:none "https://github.com/$env:SOURCE_REPO.git" "$env:RUNNER_TEMP\source-review"
          git -C "$env:RUNNER_TEMP\source-review" checkout --detach $env:SOURCE_SHA
          if ((git -C "$env:RUNNER_TEMP\source-review" rev-parse HEAD) -ne $env:SOURCE_SHA) { throw 'source SHA mismatch' }

      - name: Review changed-path scope and unchanged UI
        shell: pwsh
        run: |
          $env:SRC_REVIEW = "$env:RUNNER_TEMP\source-review"
          @'
          import hashlib, os, pathlib, subprocess
          src = pathlib.Path(os.environ['SRC_REVIEW'])
          dst = pathlib.Path('.')
          source_paths = set(subprocess.check_output(['git','-C',str(src),'ls-files'], text=True).splitlines())
          dest_paths = set(subprocess.check_output(['git','ls-files'], text=True).splitlines())
          extras = dest_paths - source_paths
          allowed_extras = {
            'SOURCE_PROVENANCE.md',
            'docs/superpowers/specs/2026-09-26-pdv-nexus-classico-azul-bootstrap-design.md',
            'docs/superpowers/plans/2026-09-26-pdv-nexus-classico-azul-fases-0-3.md',
            'docs/baseline-fases-0-3.md',
            'windows-10/apps/nexus-desktop/pdv-product-identity.cjs',
            'windows-7/apps/nexus-desktop/pdv-product-identity.cjs',
            'windows-10/tests/pdv-classic-product-isolation.test.mjs',
            'windows-7/tests/pdv-classic-product-isolation.test.mjs',
          }
          if extras != allowed_extras:
              raise SystemExit(f'unexpected extra paths: {sorted(extras ^ allowed_extras)}')

          allowed_modified = {
            'pdv-release.json',
            'windows-10/apps/nexus-desktop/bootstrap.cjs',
            'windows-7/apps/nexus-desktop/bootstrap.cjs',
            'windows-10/apps/nexus-desktop/main.cjs',
            'windows-7/apps/nexus-desktop/main.cjs',
            'windows-10/apps/nexus-desktop/electron-builder.cjs',
            'windows-7/apps/nexus-desktop/electron-builder.cjs',
            'windows-10/apps/nexus-desktop/electron-builder-pdv.cjs',
            'windows-7/apps/nexus-desktop/electron-builder-pdv.cjs',
          }
          def digest(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()
          modified = {p for p in source_paths & dest_paths if digest(src/p) != digest(dst/p)}
          if modified != allowed_modified:
              raise SystemExit(f'modified scope mismatch: {sorted(modified ^ allowed_modified)}')

          for ui in ['windows-10/apps/pdv-demo/src/PdvDemoApp.tsx','windows-7/apps/pdv-demo/src/PdvDemoApp.tsx']:
              assert digest(src/ui) == digest(dst/ui), f'UI changed unexpectedly: {ui}'
          print('scope review OK')
          print('modified:', *sorted(modified), sep='\n- ')
          PY
          '@ | python -

      - name: Final aggregate gate
        shell: cmd
        working-directory: windows-10
        run: npm run typecheck && npm run test:pdv-payments && npm run test:pdv-upgrade && node --test tests/pdv-classic-product-isolation.test.mjs && npm run build:pdv-demo

      - name: Confirm no dangerous original runtime references
        shell: pwsh
        run: |
          $files = @(
            'pdv-release.json',
            'windows-10/apps/nexus-desktop/bootstrap.cjs',
            'windows-10/apps/nexus-desktop/main.cjs',
            'windows-10/apps/nexus-desktop/electron-builder.cjs',
            'windows-10/apps/nexus-desktop/electron-builder-pdv.cjs',
            'windows-7/apps/nexus-desktop/bootstrap.cjs',
            'windows-7/apps/nexus-desktop/main.cjs',
            'windows-7/apps/nexus-desktop/electron-builder.cjs',
            'windows-7/apps/nexus-desktop/electron-builder-pdv.cjs'
          )
          $danger = 'com.nexuscore.pdv|PDV-Nexus-Setup|PDVNexus/releases/latest/download|1M0_SfF1h_zUqEM-Ns1HJ8ZtCMMcbHnFr'
          $matches = Select-String -Path $files -Pattern $danger
          if ($matches) { $matches | Format-Table; throw 'dangerous original runtime reference remains' }
          Write-Host 'Final isolation reference scan: PASS'
