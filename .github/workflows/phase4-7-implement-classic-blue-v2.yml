name: Implement Classic Blue Phases 4-7 v2

on:
  push:
    branches:
      - work/fases-4-7-classico-azul
    paths:
      - .github/workflows/phase4-7-implement-classic-blue-v2.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/fases-4-7-classico-azul
          fetch-depth: 0
      - name: Apply deterministic Classic Blue patch
        run: python scripts/apply-classic-blue-ui.py
      - name: Install Windows 10 dependencies
        working-directory: windows-10
        run: npm ci
      - name: GREEN Windows 10 UI contract
        working-directory: windows-10
        run: node --test tests/pdv-classic-blue-ui.test.mjs
      - name: Typecheck Windows 10
        working-directory: windows-10
        run: npm run typecheck
      - name: Build Windows 10 renderer
        working-directory: windows-10
        run: npm run build:pdv-demo
      - name: Install legacy dependencies
        working-directory: windows-7
        run: npm ci
      - name: GREEN legacy UI contract
        working-directory: windows-7
        run: node --test tests/pdv-classic-blue-ui.test.mjs
      - name: Typecheck legacy line
        working-directory: windows-7
        run: npm run typecheck
      - name: Build legacy renderer
        working-directory: windows-7
        run: npm run build:pdv-demo
      - name: Commit implementation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add windows-10/apps/pdv-demo/src/PdvDemoApp.tsx windows-10/apps/pdv-demo/src/pdv-classic-blue.css windows-7/apps/pdv-demo/src/PdvDemoApp.tsx windows-7/apps/pdv-demo/src/pdv-classic-blue.css
          git commit -m "feat: implement classic blue cashier UI"
          git push origin HEAD:work/fases-4-7-classico-azul
