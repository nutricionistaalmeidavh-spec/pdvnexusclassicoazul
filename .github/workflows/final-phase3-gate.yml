name: Final Phase 3 Gate

on:
  push:
    branches:
      - work/fases-0-3-classico-azul
    paths:
      - .github/workflows/final-phase3-gate.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/fases-0-3-classico-azul
          fetch-depth: 0
      - name: Install exact Windows 10 dependencies
        working-directory: windows-10
        run: npm ci
      - name: Final Windows 10 aggregate gate
        shell: cmd
        working-directory: windows-10
        run: npm run typecheck && npm run test:pdv-payments && npm run test:pdv-upgrade && node --test tests/pdv-classic-product-isolation.test.mjs && npm run build:pdv-demo
      - name: Final legacy isolation tests
        working-directory: windows-7
        run: node --test tests/pdv-classic-product-isolation.test.mjs tests/pdv-classic-legacy-builder-isolation.test.mjs
      - name: Verify release publication remains disabled
        shell: pwsh
        run: |
          $workflow=Get-Content .github/workflows/publish-pdv-release.yml -Raw
          if($workflow -notmatch 'if: \$\{\{ false \}\}') { throw 'publish workflow is not hard-disabled' }
          $release=Get-Content pdv-release.json -Raw | ConvertFrom-Json
          if($null -ne $release.manifestUrl) { throw 'manifestUrl must remain null through Phase 3' }
          if(($release.distribution.PSObject.Properties | Measure-Object).Count -ne 0) { throw 'distribution must remain empty through Phase 3' }
          Write-Host 'Release/update isolation: PASS'
